<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitten Server Finder</title>
  <style>
    :root { color-scheme: dark; --bg:#10131b; --panel:#1a2030; --muted:#aab4c5; --line:#30394d; --accent:#7c9cff; --green:#55d6a2; }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 14px 40px; background:var(--bg); color:#f4f6fb; font:16px/1.45 Arial, sans-serif; }
    main { max-width:820px; margin:0 auto; }
    h1 { margin:0 0 5px; font-size:27px; }
    .sub, .note { color:var(--muted); }
    .sub { margin:0 0 18px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:16px 0; }
    button, .join { border:0; border-radius:9px; padding:10px 14px; font-weight:700; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    #refresh { background:var(--accent); color:#101522; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { color:var(--muted); font-size:14px; }
    .note { font-size:13px; margin:10px 0 18px; }
    .server { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px; margin:11px 0; }
    .top { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    .server-name { font-size:18px; font-weight:700; }
    .count { background:#243b35; color:var(--green); padding:5px 9px; border-radius:20px; font-size:13px; font-weight:700; }
    .details { color:var(--muted); font-size:13px; margin:9px 0 13px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
    .join { background:var(--green); color:#10221b; }
    .tried { background:#3a4050; color:#f1f3f8; }
    .mark { background:#2c3857; color:#dce5ff; }
    .server.is-tried { opacity:.68; border-color:#596174; }
    .server.is-tried .server-name::after { content:"  ·  TRIED"; color:#f0c36b; font-size:12px; letter-spacing:.04em; }
    .empty { padding:24px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); text-align:center; }
    @media (max-width:480px) { h1 { font-size:23px; } .server { padding:13px; } }
  </style>
</head>
<body>
<main>
  <h1>🐱 Kitten Server Finder</h1>
  <p class="sub">Break and Steal A Kitty Egg — public servers with the fewest players first.</p>

  <div class="toolbar">
    <button id="refresh" type="button">Refresh servers</button>
    <span id="status">Loading servers…</span>
  </div>
  <p class="note">“Mark as tried” is saved in this browser. Server labels are assigned by the current sorted list; the saved status follows each server's unique ID.</p>

  <section id="servers" aria-live="polite">
    <div class="empty">Loading public servers…</div>
  </section>
</main>

<script>
(() => {
  const PLACE_ID = "88139827763026";
  const API_URL = `https://games.roblox.com/v1/games/${PLACE_ID}/servers/Public?limit=100&sortOrder=Asc&excludeFullGames=true`;
  const PROXY = "https://proxy.cors.dev/";
  const STORAGE_KEY = "kittenServerFinderTried_v1";

  const list = document.getElementById("servers");
  const status = document.getElementById("status");
  const refreshButton = document.getElementById("refresh");

  function readTried() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
    catch (_) { return new Set(); }
  }
  function saveTried(set) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }
    catch (_) {}
  }

  function makeServerCard(server, index, tried) {
    const card = document.createElement("article");
    card.className = "server" + (tried.has(server.id) ? " is-tried" : "");

    const top = document.createElement("div");
    top.className = "top";

    const name = document.createElement("div");
    name.className = "server-name";
    name.textContent = `Server ${index + 1}`;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = `${server.playing} / ${server.maxPlayers} players`;
    top.append(name, count);

    const details = document.createElement("div");
    details.className = "details";
    const parts = [];
    if (server.ping != null) parts.push(`${Math.round(server.ping)} ms ping`);
    if (server.fps != null) parts.push(`${Math.round(server.fps)} FPS`);
    parts.push(`ID: ${server.id.slice(0, 8)}`);
    details.textContent = parts.join(" · ");

    const actions = document.createElement("div");
    actions.className = "actions";

    const join = document.createElement("a");
    join.className = "join";
    join.href = `roblox://experiences/start?placeId=${PLACE_ID}&gameInstanceId=${encodeURIComponent(server.id)}`;
    join.textContent = "Join server";

    const mark = document.createElement("button");
    mark.type = "button";
    mark.className = tried.has(server.id) ? "tried" : "mark";
    mark.textContent = tried.has(server.id) ? "Already tried" : "Mark as tried";
    mark.addEventListener("click", () => {
      const current = readTried();
      if (current.has(server.id)) current.delete(server.id);
      else current.add(server.id);
      saveTried(current);
      renderServers(window.currentServers || []);
    });

    actions.append(join, mark);
    card.append(top, details, actions);
    return card;
  }

  function renderServers(servers) {
    window.currentServers = servers;
    list.replaceChildren();
    if (!servers.length) {
      list.innerHTML = '<div class="empty">No public servers were returned. Try refreshing in a little while.</div>';
      return;
    }
    const tried = readTried();
    servers.forEach((server, index) => list.appendChild(makeServerCard(server, index, tried)));
  }

  async function loadServers() {
    refreshButton.disabled = true;
    status.textContent = "Checking Roblox public servers…";
    list.innerHTML = '<div class="empty">Loading public servers…</div>';
    try {
      const response = await fetch(PROXY + API_URL, { credentials: "omit", cache: "no-store" });
      if (!response.ok) throw new Error(`Request failed (${response.status})`);
      const data = await response.json();
      const servers = (data.data || [])
        .filter(server => server && server.id)
        .sort((a, b) => (a.playing - b.playing) || ((a.ping ?? 9999) - (b.ping ?? 9999)));
      renderServers(servers);
      status.textContent = `${servers.length} servers found`;
    } catch (error) {
      list.innerHTML = '<div class="empty">Could not load servers. Please try again in a little while.</div>';
      status.textContent = error.message || "Could not load servers";
    } finally {
      refreshButton.disabled = false;
    }
  }

  refreshButton.addEventListener("click", loadServers);
  loadServers();
})();
</script>
</body>
</html>
